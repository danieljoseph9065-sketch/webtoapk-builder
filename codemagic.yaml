workflows:
  android-release:
    name: WebToApp Android Release & AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        CUSTOM_APP_NAME: "WebToApp"
        CUSTOM_TARGET_URL: "https://flutter.dev"
        CUSTOM_THEME_COLOR: "#4F46E5"
        CUSTOM_SPLASH_BG: "#1E1B4B"
        CUSTOM_SPLASH_DURATION: "2"
        CUSTOM_SPLASH_DESIGN: "circle_pulse"
        CUSTOM_LAYOUT_DESIGN: "bottom_nav"
        CUSTOM_NO_INTERNET_FORMAT: "friendly_illustration"
        CUSTOM_SHOW_APPBAR: "true"
        CUSTOM_SHOW_DRAWER: "false"
        CUSTOM_SHOW_BOTTOM_NAV: "true"
        CUSTOM_BOTTOM_NAV_ITEMS: "home,back,forward,reload,share"
        CUSTOM_BOTTOM_BUTTONS_COUNT: "4"
        CUSTOM_BOTTOM_BUTTONS_DATA: "Home|home|;;Shop|shop|;;Offers|offer|;;Support|chat|"
        CUSTOM_SHOW_FAB: "false"
        CUSTOM_FAB_ACTION_TYPE: "whatsapp"
        CUSTOM_FAB_PHONE: ""
        CUSTOM_FAB_TITLE: "Support"
        CUSTOM_FAB_URL: ""
        CUSTOM_FAB_ICON: "whatsapp"
        CUSTOM_ENABLE_ZOOM: "true"
        CUSTOM_ENABLE_REFRESH: "true"
        REQ_CAMERA: "false"
        REQ_LOCATION: "false"
        REQ_STORAGE: "true"
        REQ_MIC: "false"
        REQ_AD_NETWORK: "none"
        REQ_ADMOB_BANNER: ""
        REQ_ADMOB_INTERSTITIAL: ""
        REQ_UNITY_GAME_ID: ""
        REQ_UNITY_BANNER: "Banner_Android"
        REQ_UNITY_INTERSTITIAL: "Interstitial_Android"
        REQ_UNITY_TEST_MODE: "true"

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Update Android App Name in AndroidManifest.xml
        script: |
          set -e
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            python3 -c '
          import os, re
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          app_name = os.environ.get("CUSTOM_APP_NAME", "WebToApp").replace("\"", "").replace("&", "and")
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"android:label=\"[^\"]*\"", f"android:label=\"{app_name}\"", content)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          fi

      - name: Generate App Config (lib/app_config.dart)
        script: |
          set -e
          mkdir -p lib
          python3 -c '
          import os, json

          def g(k, d=""):
              return os.environ.get(k, d)

          def b(k, d="false"):
              return "true" if os.environ.get(k, d).lower() == "true" else "false"

          lines = [
              "class AppConfig {",
              f"  static const String appName = {json.dumps(g(\"CUSTOM_APP_NAME\", \"WebToApp\"))};",
              f"  static const String targetUrl = {json.dumps(g(\"CUSTOM_TARGET_URL\", \"https://flutter.dev\"))};",
              f"  static const String themeColor = {json.dumps(g(\"CUSTOM_THEME_COLOR\", \"#4F46E5\"))};",
              f"  static const String splashBg = {json.dumps(g(\"CUSTOM_SPLASH_BG\", \"#1E1B4B\"))};",
              f"  static const int splashDuration = {int(g(\"CUSTOM_SPLASH_DURATION\", \"2\") or 2)};",
              f"  static const String splashDesign = {json.dumps(g(\"CUSTOM_SPLASH_DESIGN\", \"circle_pulse\"))};",
              f"  static const String layoutDesign = {json.dumps(g(\"CUSTOM_LAYOUT_DESIGN\", \"bottom_nav\"))};",
              f"  static const String noInternetFormat = {json.dumps(g(\"CUSTOM_NO_INTERNET_FORMAT\", \"friendly_illustration\"))};",
              f"  static const bool showAppBar = {b(\"CUSTOM_SHOW_APPBAR\", \"true\")};",
              f"  static const bool showDrawer = {b(\"CUSTOM_SHOW_DRAWER\", \"false\")};",
              f"  static const bool showBottomNav = {b(\"CUSTOM_SHOW_BOTTOM_NAV\", \"true\")};",
              f"  static const String bottomNavItems = {json.dumps(g(\"CUSTOM_BOTTOM_NAV_ITEMS\", \"home,back,forward,reload,share\"))};",
              f"  static const int bottomButtonsCount = {int(g(\"CUSTOM_BOTTOM_BUTTONS_COUNT\", \"4\") or 4)};",
              f"  static const String bottomButtonsData = {json.dumps(g(\"CUSTOM_BOTTOM_BUTTONS_DATA\", \"Home|home|;;Shop|shop|;;Offers|offer|;;Support|chat|\"))};",
              f"  static const bool showFab = {b(\"CUSTOM_SHOW_FAB\", \"false\")};",
              f"  static const String fabActionType = {json.dumps(g(\"CUSTOM_FAB_ACTION_TYPE\", \"whatsapp\"))};",
              f"  static const String fabPhone = {json.dumps(g(\"CUSTOM_FAB_PHONE\", \"\"))};",
              f"  static const String fabTitle = {json.dumps(g(\"CUSTOM_FAB_TITLE\", \"Support\"))};",
              f"  static const String fabUrl = {json.dumps(g(\"CUSTOM_FAB_URL\", \"\"))};",
              f"  static const String fabIcon = {json.dumps(g(\"CUSTOM_FAB_ICON\", \"whatsapp\"))};",
              f"  static const bool enableZoom = {b(\"CUSTOM_ENABLE_ZOOM\", \"true\")};",
              f"  static const bool enableRefresh = {b(\"CUSTOM_ENABLE_REFRESH\", \"true\")};",
              f"  static const bool reqCamera = {b(\"REQ_CAMERA\", \"false\")};",
              f"  static const bool reqLocation = {b(\"REQ_LOCATION\", \"false\")};",
              f"  static const bool reqStorage = {b(\"REQ_STORAGE\", \"true\")};",
              f"  static const bool reqMic = {b(\"REQ_MIC\", \"false\")};",
              f"  static const String adNetwork = {json.dumps(g(\"REQ_AD_NETWORK\", \"none\"))};",
              f"  static const String unityGameId = {json.dumps(g(\"REQ_UNITY_GAME_ID\", \"\"))};",
              f"  static const String unityBanner = {json.dumps(g(\"REQ_UNITY_BANNER\", \"Banner_Android\"))};",
              f"  static const String unityInterstitial = {json.dumps(g(\"REQ_UNITY_INTERSTITIAL\", \"Interstitial_Android\"))};",
              f"  static const bool unityTestMode = {b(\"REQ_UNITY_TEST_MODE\", \"true\")};",
              "}"
          ]

          with open("lib/app_config.dart", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          '
          cat lib/app_config.dart

      - name: Get Flutter dependencies
        script: |
          flutter packages get

      - name: Build Android Release APK & Play Store AAB
        script: |
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons || true

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
