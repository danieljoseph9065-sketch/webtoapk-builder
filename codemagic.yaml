workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Ensure Flutter Android scaffold exists
        script: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Generating missing Flutter Android project files..."
            flutter create . --platforms=android --org com.appbuilder
          fi

      - name: Inject Dynamic App Configuration
        script: |
          mkdir -p lib
          cat << 'EOF' > lib/app_config.dart
          // Generated automatically by Codemagic build
          class AppConfig {
            static const String appName = "${CUSTOM_APP_NAME:-WebToApp}";
            static const String targetUrl = "${CUSTOM_TARGET_URL:-https://example.com}";
            static const String themeColor = "${CUSTOM_THEME_COLOR:-#4F46E5}";
            static const String splashBg = "${CUSTOM_SPLASH_BG:-#1E1B4B}";
            static const int splashDuration = ${CUSTOM_SPLASH_DURATION:-2};
            static const bool showAppBar = ${CUSTOM_SHOW_APPBAR:-true};
            static const bool showDrawer = ${CUSTOM_SHOW_DRAWER:-false};
            static const bool showBottomNav = ${CUSTOM_SHOW_BOTTOM_NAV:-true};
            static const bool showFab = ${CUSTOM_SHOW_FAB:-false};
            static const String fabUrl = "${CUSTOM_FAB_URL:-}";
            static const bool enableZoom = ${CUSTOM_ENABLE_ZOOM:-true};
            static const bool enableRefresh = ${CUSTOM_ENABLE_REFRESH:-true};
          }
          EOF

      - name: Inject Dynamic AndroidManifest Permissions
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|android:label=\"[^\"]*\"|android:label=\"${CUSTOM_APP_NAME:-WebToApp}\"|g" "$MANIFEST"
            [ "$REQ_CAMERA" = "true" ] && sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA"/>\n</manifest>|g' "$MANIFEST"
            [ "$REQ_LOCATION" = "true" ] && sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n</manifest>|g' "$MANIFEST"
            [ "$REQ_STORAGE" = "true" ] && sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n</manifest>|g' "$MANIFEST"
            [ "$REQ_MIC" = "true" ] && sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n</manifest>|g' "$MANIFEST"
          fi

      - name: Build Android Release APK
        script: |
          flutter packages get
          flutter build apk --release --no-shrink

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - danieljoseph9065@gmail.com
        notify:
          on_build_failure: true
          on_build_success: true
