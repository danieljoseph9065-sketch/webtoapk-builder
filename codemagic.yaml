workflows:
  android-release:
    name: Build Android APK and AAB Bundle
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        CUSTOM_APP_NAME: "WebToApp"
        CUSTOM_TARGET_URL: "https://flutter.dev"
        CUSTOM_PACKAGE_NAME: "com.user.webtoapp"
        CUSTOM_THEME_COLOR: "#4F46E5"
        CUSTOM_SPLASH_BG: "#1E1B4B"
        CUSTOM_SPLASH_DURATION: "2"
        CUSTOM_SPLASH_DESIGN: "circle_pulse"
        CUSTOM_LAYOUT_DESIGN: "bottom_nav"
        CUSTOM_NO_INTERNET_FORMAT: "illustration"
        CUSTOM_SHOW_APPBAR: "true"
        CUSTOM_SHOW_DRAWER: "false"
        CUSTOM_DRAWER_SUBTITLE: "Official Mobile App"
        CUSTOM_DRAWER_ITEMS_COUNT: "4"
        CUSTOM_DRAWER_ITEMS_DATA: "Home|home|https://flutter.dev;;Products|shop|https://flutter.dev;;Offers|offer|https://flutter.dev;;Support|chat|https://flutter.dev"
        CUSTOM_SHOW_BOTTOM_NAV: "true"
        CUSTOM_BOTTOM_NAV_ITEMS: "home,back,forward,reload,share"
        CUSTOM_BOTTOM_BUTTONS_COUNT: "4"
        CUSTOM_BOTTOM_BUTTONS_DATA: "Home|home|https://flutter.dev;;Shop|shop|https://flutter.dev;;Offers|offer|https://flutter.dev;;Support|chat|https://flutter.dev"
        CUSTOM_SHOW_FAB: "false"
        CUSTOM_FAB_ACTION_TYPE: "whatsapp"
        CUSTOM_FAB_PHONE: "none"
        CUSTOM_FAB_TITLE: "Support"
        CUSTOM_FAB_URL: "none"
        CUSTOM_FAB_ICON: "whatsapp"
        CUSTOM_ENABLE_ZOOM: "true"
        CUSTOM_ENABLE_REFRESH: "true"
        REQ_CAMERA: "false"
        REQ_LOCATION: "false"
        REQ_STORAGE: "false"
        REQ_MIC: "false"
        REQ_AD_NETWORK: "none"
        REQ_ADMOB_BANNER: "none"
        REQ_ADMOB_INTERSTITIAL: "none"
        REQ_UNITY_GAME_ID: "none"
        REQ_UNITY_BANNER: "Banner_Android"
        REQ_UNITY_INTERSTITIAL: "Interstitial_Android"
        REQ_UNITY_TEST_MODE: "true"
        CUSTOM_APP_LOGO_URL: "none"
        CUSTOM_APP_LOGO_PRESET: "globe"
    scripts:
      - name: Generate App Config
        script: |
          set -e
          mkdir -p lib
          python3 -c "import os; g=lambda k,d: ('' if os.environ.get(k,d)=='none' else os.environ.get(k,d)); f=open('lib/app_config.dart','w'); f.write('class AppConfig {\n  static const String appName = \"'+g('CUSTOM_APP_NAME','WebToApp')+'\";\n  static const String targetUrl = \"'+g('CUSTOM_TARGET_URL','https://flutter.dev')+'\";\n  static const String themeColor = \"'+g('CUSTOM_THEME_COLOR','#4F46E5')+'\";\n  static const String splashBg = \"'+g('CUSTOM_SPLASH_BG','#1E1B4B')+'\";\n  static const int splashDuration = '+g('CUSTOM_SPLASH_DURATION','2')+';\n  static const String splashDesign = \"'+g('CUSTOM_SPLASH_DESIGN','circle_pulse')+'\";\n  static const String layoutDesign = \"'+g('CUSTOM_LAYOUT_DESIGN','bottom_nav')+'\";\n  static const String noInternetFormat = \"'+g('CUSTOM_NO_INTERNET_FORMAT','illustration')+'\";\n  static const bool showAppBar = '+('true' if g('CUSTOM_SHOW_APPBAR','true').lower()=='true' else 'false')+';\n  static const bool showDrawer = '+('true' if g('CUSTOM_SHOW_DRAWER','false').lower()=='true' else 'false')+';\n  static const String drawerSubtitle = \"'+g('CUSTOM_DRAWER_SUBTITLE','Official Mobile App')+'\";\n  static const int drawerItemsCount = '+g('CUSTOM_DRAWER_ITEMS_COUNT','4')+';\n  static const String drawerItemsData = \"'+g('CUSTOM_DRAWER_ITEMS_DATA','')+'\";\n  static const bool showBottomNav = '+('true' if g('CUSTOM_SHOW_BOTTOM_NAV','true').lower()=='true' else 'false')+';\n  static const String bottomNavItems = \"'+g('CUSTOM_BOTTOM_NAV_ITEMS','home,back,forward,reload,share')+'\";\n  static const int bottomButtonsCount = '+g('CUSTOM_BOTTOM_BUTTONS_COUNT','4')+';\n  static const String bottomButtonsData = \"'+g('CUSTOM_BOTTOM_BUTTONS_DATA','')+'\";\n  static const bool showFab = '+('true' if g('CUSTOM_SHOW_FAB','false').lower()=='true' else 'false')+';\n  static const String fabActionType = \"'+g('CUSTOM_FAB_ACTION_TYPE','whatsapp')+'\";\n  static const String fabPhone = \"'+g('CUSTOM_FAB_PHONE','')+'\";\n  static const String fabTitle = \"'+g('CUSTOM_FAB_TITLE','Support')+'\";\n  static const String fabUrl = \"'+g('CUSTOM_FAB_URL','')+'\";\n  static const String fabIcon = \"'+g('CUSTOM_FAB_ICON','whatsapp')+'\";\n  static const bool enableZoom = '+('true' if g('CUSTOM_ENABLE_ZOOM','true').lower()=='true' else 'false')+';\n  static const bool enableRefresh = '+('true' if g('CUSTOM_ENABLE_REFRESH','true').lower()=='true' else 'false')+';\n  static const bool reqCamera = '+('true' if g('REQ_CAMERA','false').lower()=='true' else 'false')+';\n  static const bool reqLocation = '+('true' if g('REQ_LOCATION','false').lower()=='true' else 'false')+';\n  static const bool reqStorage = '+('true' if g('REQ_STORAGE','false').lower()=='true' else 'false')+';\n  static const bool reqMic = '+('true' if g('REQ_MIC','false').lower()=='true' else 'false')+';\n}\n'); f.close()"

      - name: Get Flutter dependencies
        script: |
          flutter packages get

      - name: Build Android Release APK & Play Store AAB
        script: |
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons || true

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
