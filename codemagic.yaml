workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Ensure Android platform files exist
        script: |
          set -e
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          elif [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          fi

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Creating Flutter Android scaffold..."
            flutter create . --platforms=android --org com.user
          fi

          mkdir -p android/app/src/main
          if [ -f "/tmp/AndroidManifest.xml.bak" ]; then
            cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          fi

          python3 -c "import os, re; p='android/app/src/main/AndroidManifest.xml'; data=open(p).read() if os.path.exists(p) else ''; data=re.sub(r'\s+package=\"[^\"]*\"', '', data); n=os.environ.get('CUSTOM_APP_NAME','WebToApp'); data=re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"'+n+'\"', data); open(p,'w').write(data) if data else None"

      - name: Generate App Config
        script: |
          set -e
          mkdir -p lib
          python3 -c "import os; g=lambda k,d: os.environ.get(k,d); f=open('lib/app_config.dart','w'); f.write('class AppConfig {\n  static const String appName = \"'+g('CUSTOM_APP_NAME','WebToApp')+'\";\n  static const String targetUrl = \"'+g('CUSTOM_TARGET_URL','https://flutter.dev')+'\";\n  static const String themeColor = \"'+g('CUSTOM_THEME_COLOR','#4F46E5')+'\";\n  static const String splashBg = \"'+g('CUSTOM_SPLASH_BG','#1E1B4B')+'\";\n  static const int splashDuration = '+g('CUSTOM_SPLASH_DURATION','2')+';\n  static const bool showAppBar = '+('true' if g('CUSTOM_SHOW_APPBAR','true').lower()=='true' else 'false')+';\n  static const bool showDrawer = '+('true' if g('CUSTOM_SHOW_DRAWER','false').lower()=='true' else 'false')+';\n  static const bool showBottomNav = '+('true' if g('CUSTOM_SHOW_BOTTOM_NAV','true').lower()=='true' else 'false')+';\n  static const String bottomNavItems = \"'+g('CUSTOM_BOTTOM_NAV_ITEMS','home,back,forward,reload,share')+'\";\n  static const bool showFab = '+('true' if g('CUSTOM_SHOW_FAB','false').lower()=='true' else 'false')+';\n  static const String fabUrl = \"'+g('CUSTOM_FAB_URL','')+'\";\n  static const String fabIcon = \"'+g('CUSTOM_FAB_ICON','chat')+'\";\n  static const bool enableZoom = '+('true' if g('CUSTOM_ENABLE_ZOOM','true').lower()=='true' else 'false')+';\n  static const bool enableRefresh = '+('true' if g('CUSTOM_ENABLE_REFRESH','true').lower()=='true' else 'false')+';\n  static const bool reqCamera = '+('true' if g('REQ_CAMERA','false').lower()=='true' else 'false')+';\n  static const bool reqLocation = '+('true' if g('REQ_LOCATION','false').lower()=='true' else 'false')+';\n  static const bool reqStorage = '+('true' if g('REQ_STORAGE','false').lower()=='true' else 'false')+';\n  static const bool reqMic = '+('true' if g('REQ_MIC','false').lower()=='true' else 'false')+';\n}\n'); f.close()"
          echo "Generated lib/app_config.dart successfully:"
          cat lib/app_config.dart

      - name: Get Flutter dependencies
        script: |
          flutter packages get

      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
