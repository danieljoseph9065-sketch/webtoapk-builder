workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Inject Selected Permissions Only
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS=""
          
          if [ "$REQ_CAMERA" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.CAMERA\"/>"
          fi
          if [ "$REQ_LOCATION" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          fi
          if [ "$REQ_STORAGE" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>"
          fi
          if [ "$REQ_MIC" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"
          fi
          if [ "$REQ_NOTIFICATIONS" = "true" ]; then
            PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>"
          fi
          
          # Replace placeholder with selected permissions
          sed -i '' "s|<!-- DYNAMIC_PERMISSIONS_PLACEHOLDER -->|$PERMS|g" $MANIFEST || sed -i "s|<!-- DYNAMIC_PERMISSIONS_PLACEHOLDER -->|$PERMS|g" $MANIFEST

      - name: Fetch Dependencies
        script: |
          flutter packages get

      - name: Build APK with Dynamic Controls
        script: |
          flutter build apk --release \
            --dart-define=APP_NAME="${CUSTOM_APP_NAME:-Web to App}" \
            --dart-define=TARGET_URL="${CUSTOM_TARGET_URL:-https://google.com}" \
            --dart-define=THEME_COLOR="${CUSTOM_THEME_COLOR:-4F46E5}" \
            --dart-define=SPLASH_BG_COLOR="${CUSTOM_SPLASH_BG:-FFFFFF}" \
            --dart-define=SPLASH_DURATION="${CUSTOM_SPLASH_DURATION:-2}" \
            --dart-define=ENABLE_ZOOM="${CUSTOM_ENABLE_ZOOM:-true}" \
            --dart-define=ENABLE_PULL_TO_REFRESH="${CUSTOM_ENABLE_REFRESH:-true}" \
            --dart-define=SHOW_APPBAR="${CUSTOM_SHOW_APPBAR:-false}" \
            --dart-define=SHOW_DRAWER="${CUSTOM_SHOW_DRAWER:-false}" \
            --dart-define=SHOW_BOTTOM_NAV="${CUSTOM_SHOW_BOTTOM_NAV:-false}" \
            --dart-define=BOTTOM_NAV_ITEMS="${CUSTOM_BOTTOM_NAV_ITEMS:-home,back,forward,reload}" \
            --dart-define=SHOW_FAB="${CUSTOM_SHOW_FAB:-false}" \
            --dart-define=FAB_ACTION_URL="${CUSTOM_FAB_URL:-}" \
            --dart-define=FAB_ICON_TYPE="${CUSTOM_FAB_ICON:-chat}"
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - danieljoseph9065@gmail.com
