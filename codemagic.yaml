workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Ensure Android platform files exist
        script: |
          set -e
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Scaffolding Android platform structure..."
            flutter create . --platforms=android --org com.user
          fi
          mkdir -p android/app/src/main
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Generate App Config
        script: |
          set -e
          mkdir -p lib
          cat << 'EOF' > lib/generate_config.py
import os

app_name = os.environ.get("CUSTOM_APP_NAME", "WebToApp")
target_url = os.environ.get("CUSTOM_TARGET_URL", "https://flutter.dev")
theme_color = os.environ.get("CUSTOM_THEME_COLOR", "#2563EB")
splash_bg = os.environ.get("CUSTOM_SPLASH_BG", "#0F172A")
splash_duration = int(os.environ.get("CUSTOM_SPLASH_DURATION", "2"))
show_appbar = os.environ.get("CUSTOM_SHOW_APPBAR", "true").lower() == "true"
show_drawer = os.environ.get("CUSTOM_SHOW_DRAWER", "false").lower() == "true"
show_bottom_nav = os.environ.get("CUSTOM_SHOW_BOTTOM_NAV", "true").lower() == "true"
bottom_nav_items = os.environ.get("CUSTOM_BOTTOM_NAV_ITEMS", "home,back,forward,reload,share")
show_fab = os.environ.get("CUSTOM_SHOW_FAB", "false").lower() == "true"
fab_url = os.environ.get("CUSTOM_FAB_URL", "")
fab_icon = os.environ.get("CUSTOM_FAB_ICON", "chat")
enable_zoom = os.environ.get("CUSTOM_ENABLE_ZOOM", "true").lower() == "true"
enable_refresh = os.environ.get("CUSTOM_ENABLE_REFRESH", "true").lower() == "true"
req_camera = os.environ.get("REQ_CAMERA", "false").lower() == "true"
req_location = os.environ.get("REQ_LOCATION", "false").lower() == "true"
req_storage = os.environ.get("REQ_STORAGE", "false").lower() == "true"
req_mic = os.environ.get("REQ_MIC", "false").lower() == "true"

content = f"""// Generated by Codemagic build pipeline
class AppConfig {{
  static const String appName = "{app_name}";
  static const String targetUrl = "{target_url}";
  static const String themeColor = "{theme_color}";
  static const String splashBg = "{splash_bg}";
  static const int splashDuration = {splash_duration};
  static const bool showAppBar = {'true' if show_appbar else 'false'};
  static const bool showDrawer = {'true' if show_drawer else 'false'};
  static const bool showBottomNav = {'true' if show_bottom_nav else 'false'};
  static const String bottomNavItems = "{bottom_nav_items}";
  static const bool showFab = {'true' if show_fab else 'false'};
  static const String fabUrl = "{fab_url}";
  static const String fabIcon = "{fab_icon}";
  static const bool enableZoom = {'true' if enable_zoom else 'false'};
  static const bool enableRefresh = {'true' if enable_refresh else 'false'};
  static const bool reqCamera = {'true' if req_camera else 'false'};
  static const bool reqLocation = {'true' if req_location else 'false'};
  static const bool reqStorage = {'true' if req_storage else 'false'};
  static const bool reqMic = {'true' if req_mic else 'false'};
}}
"""

with open("lib/app_config.dart", "w") as f:
    f.write(content)
print("app_config.dart generated successfully.")
EOF
          python3 lib/generate_config.py

      - name: Get Flutter dependencies
        script: |
          flutter packages get

      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
