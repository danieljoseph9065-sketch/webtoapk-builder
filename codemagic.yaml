workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Set up dependencies
        script: |
          flutter packages get
      - name: Build APK with dynamic parameters
        script: |
          APP_NAME="${CUSTOM_APP_NAME:-Web to App}"
          TARGET_URL="${CUSTOM_TARGET_URL:-https://google.com}"
          THEME_COLOR="${CUSTOM_THEME_COLOR:-4F46E5}"
          SPLASH_BG_COLOR="${CUSTOM_SPLASH_BG:-FFFFFF}"
          SPLASH_DURATION="${CUSTOM_SPLASH_DURATION:-2}"
          SHOW_APPBAR="${CUSTOM_SHOW_APPBAR:-false}"
          SHOW_BOTTOM_NAV="${CUSTOM_SHOW_BOTTOM_NAV:-false}"
          SHOW_FAB="${CUSTOM_SHOW_FAB:-false}"
          FAB_ACTION_URL="${CUSTOM_FAB_URL:-}"
          ENABLE_AUTH="${CUSTOM_ENABLE_AUTH:-false}"
          
          flutter build apk --release \
            --dart-define=APP_NAME="$APP_NAME" \
            --dart-define=TARGET_URL="$TARGET_URL" \
            --dart-define=THEME_COLOR="$THEME_COLOR" \
            --dart-define=SPLASH_BG_COLOR="$SPLASH_BG_COLOR" \
            --dart-define=SPLASH_DURATION="$SPLASH_DURATION" \
            --dart-define=SHOW_APPBAR="$SHOW_APPBAR" \
            --dart-define=SHOW_BOTTOM_NAV="$SHOW_BOTTOM_NAV" \
            --dart-define=SHOW_FAB="$SHOW_FAB" \
            --dart-define=FAB_ACTION_URL="$FAB_ACTION_URL" \
            --dart-define=ENABLE_AUTH="$ENABLE_AUTH"
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - danieljoseph9065@gmail.com
