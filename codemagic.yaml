workflows:
  android-release:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - app_vars
    scripts:
      - name: Set up Android permissions dynamically
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PERMS=""
            [ "$REQ_CAMERA" = "true" ] && PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.CAMERA\"/>"
            [ "$REQ_LOCATION" = "true" ] && PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
            [ "$REQ_STORAGE" = "true" ] && PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>"
            [ "$REQ_MIC" = "true" ] && PERMS="$PERMS\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"
            
            # Safe replacement for Linux runner
            sed -i "s|<!-- DYNAMIC_PERMISSIONS_PLACEHOLDER -->|$PERMS|g" "$MANIFEST" || true
          fi

      - name: Get Flutter packages
        script: |
          flutter packages get

      - name: Build Android Release APK
        script: |
          flutter build apk --release \
            --dart-define=APP_NAME="${CUSTOM_APP_NAME:-Web to App}" \
            --dart-define=TARGET_URL="${CUSTOM_TARGET_URL:-https://google.com}" \
            --dart-define=THEME_COLOR="${CUSTOM_THEME_COLOR:-3b49df}" \
            --dart-define=SPLASH_BG_COLOR="${CUSTOM_SPLASH_BG:-ffffff}" \
            --dart-define=SPLASH_DURATION="${CUSTOM_SPLASH_DURATION:-2}" \
            --dart-define=ENABLE_ZOOM="${CUSTOM_ENABLE_ZOOM:-true}" \
            --dart-define=ENABLE_PULL_TO_REFRESH="${CUSTOM_ENABLE_REFRESH:-true}" \
            --dart-define=SHOW_APPBAR="${CUSTOM_SHOW_APPBAR:-false}" \
            --dart-define=SHOW_DRAWER="${CUSTOM_SHOW_DRAWER:-false}" \
            --dart-define=SHOW_BOTTOM_NAV="${CUSTOM_SHOW_BOTTOM_NAV:-false}" \
            --dart-define=BOTTOM_NAV_ITEMS="${CUSTOM_BOTTOM_NAV_ITEMS:-home,back,forward,reload}" \
            --dart-define=SHOW_FAB="${CUSTOM_SHOW_FAB:-false}" \
            --dart-define=FAB_ACTION_URL="${CUSTOM_FAB_URL:-}" \
            --dart-define=FAB_ICON_TYPE="${CUSTOM_FAB_ICON:-chat}"
    artifacts:
      - build/**/outputs/**/*.apk
